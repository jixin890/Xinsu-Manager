name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write signing key
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            {
              echo KEYSTORE_FILE='key.jks'
              echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
              echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
              echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
            } >> gradle.properties
            echo "${{ secrets.KEYSTORE }}" | base64 -d > key.jks
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" ! -name "*unsigned*" | head -n 1)
          echo "apk=$APK" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: manager-apk
          path: ${{ steps.apk.outputs.apk }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: manager-apk
          path: dist

      - name: Rename APK
        run: |
          APK=$(find dist -maxdepth 1 -name "*.apk" | head -n 1)
          VER=$(basename "$APK" | sed -E 's/^[^_]+_([0-9.]+)_([0-9]+).*/\1/')
          CODE=$(basename "$APK" | sed -E 's/^[^_]+_([0-9.]+)_([0-9]+).*/\2/')
          mv "$APK" "dist/Xinsu_v${VER}_${CODE}-release.apk"
          ls -la dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Xinsu_v*_*-release.apk
          generate_release_notes: true
